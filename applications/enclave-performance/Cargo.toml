[package]
name = "enclave-performance"
version = "0.1.0"
edition = "2021"

[dependencies]
vsock = "0.5"
k256 = { version = "0.13", features = ["ecdsa"] }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
proptest = "1.4"

[[bin]]
name = "enclave"
path = "src/bin/enclave.rs"

[[bin]]
name = "pod"
path = "src/bin/pod.rs"
